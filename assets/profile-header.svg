  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#102B2A"/><stop offset="1" stop-color="#183C37"/></linearGradient>
    <linearGradient id="tile" x1="890" y1="75" x2="1090" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#B9E4CA"/><stop offset="1" stop-color="#65AA8E"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#CDE9DC" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
